---
- name: Setup e Deployment dell'Infrastruttura PayMySeat su EC2
  hosts: all
  become: true

  tasks:
    - name: Aggiorna la cache dei pacchetti apt
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Installa i pacchetti prerequisiti
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - git
        state: present

    - name: Aggiungi la chiave GPG ufficiale di Docker
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Aggiungi il repository di Docker
      apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present

    - name: Installa Docker Engine e Docker Compose Plugin
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present

    - name: Assicura che il servizio Docker sia attivo e abilitato
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Aggiungi l'utente ubuntu al gruppo docker
      user:
        name: ubuntu
        groups: docker
        append: yes

    - name: Crea la directory per il progetto
      file:
        path: /home/ubuntu/paymyseat
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'

    - name: Copia l'intero progetto PayMySeat sulla macchina remota
      delegate_to: localhost
      ansible.builtin.command:
        cmd: "rsync -a --exclude='.git' --exclude='node_modules' --exclude='.terraform' --exclude='*.tfstate*' --exclude='*.pem' --exclude='__pycache__' -e 'ssh -i ~/.ssh/paymyseat_key.pem -o StrictHostKeyChecking=no' '{{ playbook_dir }}/../../../' ubuntu@{{ inventory_hostname }}:/home/ubuntu/paymyseat/"
      become: false

    - name: Crea file di swap da 2GB per evitare blocchi della RAM (t3.micro ha solo 1GB)
      ansible.builtin.shell: |
        fallocate -l 2G /swapfile
        chmod 600 /swapfile
        mkswap /swapfile
        swapon /swapfile
      args:
        creates: /swapfile
      become: true

    - name: Imposta i permessi corretti sul progetto
      file:
        path: /home/ubuntu/paymyseat
        owner: ubuntu
        group: ubuntu
        recurse: yes

    - name: Avvia lo stack applicativo con Docker Compose
      ansible.builtin.command:
        cmd: docker compose up --build -d
        chdir: /home/ubuntu/paymyseat
      become: true
      register: compose_output

    - name: Mostra lo stato dei container avviati
      debug:
        var: compose_output